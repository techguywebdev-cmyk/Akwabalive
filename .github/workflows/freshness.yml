# Keeps Akwaaba fresh: every 2 hours, look for new events on ticket sites and new line-up news.
# (Vercel's plan only allows daily schedules, so GitHub runs the frequent ones.)
# Needs one repository secret: FRESHNESS_KEY (the same value as the FRESHNESS_KEY env var in Vercel, 16+ characters).
name: Freshness

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://akwabalive.vercel.app
      KEY: ${{ secrets.FRESHNESS_KEY }}
    steps:
      - name: Check the key
        run: |
          if [ -z "$KEY" ]; then echo "::error::No FRESHNESS_KEY secret found in this repository"; exit 1; fi
          echo "FRESHNESS_KEY found (${#KEY} characters)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $KEY" "$SITE/api/events/campus")
          if [ "$code" = "401" ]; then echo "::error::The site rejected the key: FRESHNESS_KEY in GitHub and in Vercel must be the same (16+ characters), and Vercel needs a redeploy after changing it"; exit 1; fi
          echo "Site accepted the key (HTTP $code)"
      - name: Line-up news (official sites + press)
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/watch" | head -c 2000; echo
        continue-on-error: true
      - name: Campus nights (SRC weeks, hall weeks, artiste nights)
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/campus" | head -c 2000; echo
        continue-on-error: true
      - name: Ticket-page info (dial codes, organiser contacts)
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/listing-info" | head -c 2000; echo
        continue-on-error: true
      - name: Read flyers (contacts, dress code, gate price)
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/read-flyers" | head -c 2000; echo
        continue-on-error: true
      - name: New events from ticket sites
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/cron/import-events" | head -c 2000; echo
        continue-on-error: true
      - name: Discover events
        run: curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $KEY" "$SITE/api/events/cron/discover-events" | head -c 2000; echo
        continue-on-error: true
