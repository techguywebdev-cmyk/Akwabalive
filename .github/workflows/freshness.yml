# Keeps Akwaaba fresh: every 2 hours, look for new events on ticket sites and new line-up news.
# (Vercel's plan only allows daily schedules, so GitHub runs the frequent ones.)
# Needs one repository secret: CRON_SECRET (the same value as in Vercel).
name: Freshness

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE: https://akwabalive.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check the secret is set
        run: test -n "$CRON_SECRET" || (echo "Add CRON_SECRET in Settings → Secrets and variables → Actions" && exit 1)
      - name: Line-up news (official sites + press)
        run: curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/events/watch" | head -c 2000; echo
      - name: Read flyers (contacts, dress code, gate price)
        run: curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/events/read-flyers" | head -c 2000; echo
        continue-on-error: true
      - name: New events from ticket sites
        run: curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/events/cron/import-events" | head -c 2000; echo
      - name: Discover events
        run: curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/events/cron/discover-events" | head -c 2000; echo
        continue-on-error: true
